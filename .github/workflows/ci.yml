name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: crm_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
      s3:  # S3-compatible object storage (presigned URLs, object lock) for tests_v2/test_object_storage.py
        image: rustfs/rustfs:1.0.1
        env: {RUSTFS_ACCESS_KEY: ci-access-key, RUSTFS_SECRET_KEY: ci-secret-key-not-a-real-secret}
        ports: ["9000:9000"]
    env:
      CRM_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/crm_test
      CRM_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      CRM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      CRM_TEST_S3_ACCESS_KEY: ci-access-key
      CRM_TEST_S3_SECRET_KEY: ci-secret-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install
        run: |
          pip install -r apps/crm-api/requirements-dev.txt -r apps/agreements/requirements.txt
          pip install -e packages/refine/python -e packages/bridge-contract/python
      - name: Lint (v2 code)
        run: ruff check .
      - name: Typecheck (v2 code)
        if: hashFiles('apps/crm-api/mypy.ini') != ''
        run: mypy --config-file apps/crm-api/mypy.ini apps/crm-api/tfsc_crm
      - name: API contract is current (openapi.json)
        run: python apps/crm-api/tools/export_openapi.py && git diff --exit-code apps/crm-api/openapi.json
      - name: Migrations up/down/up
        working-directory: apps/crm-api
        env: {CRM_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/crm_test}
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic downgrade base
      - name: CRM pilot tests (v1.0.1 behaviour preserved)
        working-directory: apps/crm-api
        run: python -m pytest -q tests
      - name: CRM v2 tests (PostgreSQL, RLS, S3)
        working-directory: apps/crm-api
        run: |
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 2; done
          python -m pytest -q tests_v2 --cov=tfsc_crm.domain --cov=tfsc_crm.security --cov-report=term --cov-fail-under=85
      - name: Refine engine vectors (Python)
        run: python -m pytest -q packages/refine/python --cov=tfsc_refine --cov-fail-under=85
      - name: Bridge contract (Python)
        if: hashFiles('packages/bridge-contract/python/**') != ''
        run: python -m pytest -q packages/bridge-contract/python --cov=tfsc_bridge --cov-fail-under=85
      - name: Agreements tests
        working-directory: apps/agreements
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/crm-web/package-lock.json}
      - name: Build CRM web
        working-directory: apps/crm-web
        run: npm ci && npm run build
      - name: Typed client matches the API contract
        working-directory: apps/crm-web
        run: npx openapi-typescript ../crm-api/openapi.json -o src/lib/schema.d.ts && git diff --exit-code src/lib/schema.d.ts
      - name: ESLint (CRM web)
        working-directory: apps/crm-web
        run: npm run lint
      - name: Unit tests (CRM web)
        working-directory: apps/crm-web
        run: npm test --if-present
      - name: Refine engine vectors (TS)
        working-directory: packages/refine/ts
        run: npm ci && npm test
      - name: Bridge contract (TS)
        if: hashFiles('packages/bridge-contract/ts/package.json') != ''
        working-directory: packages/bridge-contract/ts
        run: npm ci && npm test

  e2e:
    # Browser acceptance flows (§26): desktop + mobile, CRM + TFSC Agreements (LibreOffice renderer), axe, dashboard snapshots.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: crm_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/crm_test
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install (Python)
        run: |
          pip install -r apps/crm-api/requirements-dev.txt -r apps/agreements/requirements.txt
          pip install -e packages/refine/python -e packages/bridge-contract/python
      - name: LibreOffice (TFSC document renderer)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/crm-web/package-lock.json}
      - name: Build CRM web + browser
        working-directory: apps/crm-web
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Playwright E2E
        working-directory: apps/crm-web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/crm-web/playwright-report
            apps/crm-web/test-results
          retention-days: 7

  security:
    # Dependency and secret scanning, SBOMs (§26).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/crm-web/package-lock.json}
      - name: Tools
        run: pip install pip-audit==2.10.1 cyclonedx-bom==7.5.0
      - name: Python dependencies (known vulnerabilities)
        run: pip-audit -r apps/crm-api/requirements.txt -r apps/agreements/requirements.txt
      - name: npm production dependencies (high and critical)
        run: for d in apps/crm-web packages/refine/ts packages/bridge-contract/ts; do (cd $d && npm audit --omit=dev --audit-level=high) || exit 1; done
      - name: Secrets in the whole history (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --no-banner -c .gitleaks.toml
      - name: SBOMs (CycloneDX)
        run: |
          mkdir -p sbom
          cyclonedx-py requirements apps/crm-api/requirements.txt -o sbom/crm-api.cdx.json
          cyclonedx-py requirements apps/agreements/requirements.txt -o sbom/agreements.cdx.json
          cd apps/crm-web && npm ci --ignore-scripts && npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --ignore-npm-errors --output-file ../../sbom/crm-web.cdx.json
      - uses: actions/upload-artifact@v4
        with: {name: sbom, path: sbom, retention-days: 30}

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Helm lint + schema validation
        run: |
          docker run --rm -v "$PWD/infra/helm:/charts" alpine/helm:3.16.4 lint /charts/tfsc-platform
          docker run --rm -v "$PWD/infra/helm:/charts" alpine/helm:3.16.4 template t /charts/tfsc-platform > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.30.0 - < rendered.yaml
          # schema validation cannot see a hook list split by YAML flow syntax: migrations must run on upgrades too
          pip install pyyaml==6.0.2 && python tools/check_helm_hooks.py < rendered.yaml
      - name: Compose file is valid
        working-directory: infra/compose
        run: cp .env.example .env && sed -i 's/=$/=ci-placeholder/' .env && docker compose --env-file .env config -q
      - name: Build images
        run: |
          docker build -f apps/crm-api/Dockerfile -t tfsc-crm:ci .
          docker build -f apps/agreements/Dockerfile -t tfsc-agreements:ci .
          docker build -t tfsc-postgres:16 infra/compose/postgres
      - name: Backups (pgBackRest) - first backup and point-in-time restore test on a fresh server
        working-directory: infra/compose
        run: |
          docker compose -p ci-backup --env-file .env up -d postgres backup
          for i in $(seq 1 60); do
            docker compose -p ci-backup --env-file .env logs backup | grep -q 'restore test \(passed\|FAILED\)' && break; sleep 5
          done
          docker compose -p ci-backup --env-file .env logs backup | tail -n 5
          docker compose -p ci-backup --env-file .env logs backup | grep -q 'restore test passed'
          docker compose -p ci-backup --env-file .env down -v
      - name: No private data in images
        run: |
          for img in tfsc-crm:ci tfsc-agreements:ci tfsc-postgres:16; do
            if docker run --rm --entrypoint sh $img -c 'find / -xdev \( -name "*.xlsx" -o -path "*private-assets*" -o -name ".env" \) 2>/dev/null | grep -v /proc' | grep .; then
              echo "private data found in $img"; exit 1; fi
          done

  k8s-smoke:
    # The Helm chart on a real (kind) cluster: install, end-to-end checks, upgrade, checks again (infra/helm/smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: kind, kubectl, helm (checksums verified)
        run: |
          curl -sSfLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64
          echo "$(curl -sSfL https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64.sha256sum | awk '{print $1}')  kind" | sha256sum -c
          curl -sSfLo kubectl https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
          echo "$(curl -sSfL https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl.sha256)  kubectl" | sha256sum -c
          curl -sSfLo helm.tgz https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "$(curl -sSfL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum | awk '{print $1}')  helm.tgz" | sha256sum -c
          tar -xzf helm.tgz --strip-components=1 linux-amd64/helm
          sudo install kind kubectl helm /usr/local/bin/
      - name: Build images
        run: |
          docker build -f apps/crm-api/Dockerfile -t tfsc-crm:2 .
          docker build -f apps/agreements/Dockerfile -t tfsc-agreements:4 .
      - name: Smoke test (install, checks, upgrade, checks)
        env: { NETPOL_ENFORCER: kube-router }
        run: infra/helm/smoke/kind-smoke.sh all
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context kind-tfsc-smoke get pods -A -o wide || true
          kubectl --context kind-tfsc-smoke -n tfsc describe pods | tail -n 120 || true
          kubectl --context kind-tfsc-smoke -n tfsc get events --sort-by=.lastTimestamp | tail -n 40 || true
