# pgBackRest for the compose stack: one stanza ("tfsc") covers the whole PostgreSQL server, so the crm, tfsc and
# keycloak databases are backed up and restored together. The repository passphrase comes from
# PGBACKREST_REPO1_CIPHER_PASS (BACKUP_PASSPHRASE in .env); keep a copy outside this server or the backups cannot be read.
# An off-site S3 repository (repo2) can be added with PGBACKREST_REPO2_* variables (docs/runbooks/backups-and-restore.md).
[global]
repo1-path=/backups/repo
repo1-cipher-type=aes-256-cbc
# keep enough full backups to restore to any moment of the last 14 days
repo1-retention-full-type=time
repo1-retention-full=14
compress-type=zst
compress-level=3
start-fast=y
process-max=2
lock-path=/backups/lock
log-path=/backups/log
log-level-console=warn
log-level-file=info
archive-timeout=120

[tfsc]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=crm
pg1-database=crm
