# TFSC unified platform: CRM v2 + Agreements + Keycloak + PostgreSQL + Redis.
#   cp .env.example .env   # fill every secret
#   docker compose --env-file .env up -d --build
# Production adds the `edge` profile (Caddy TLS) and sets CRM_MODE=hosted with https origins.
# The apps, Keycloak and object storage publish their ports on 127.0.0.1 only (PUBLISH_ADDR): Docker's port rules
# bypass host firewalls such as ufw, so on a public server only the edge's 80/443 are reachable from outside.
# One VPS, step by step: deploy/vps/README.md (`deploy/vps/tfsc.sh install`).
name: tfsc-unified

x-crm: &crm
  image: tfsc-crm:2
  build: { context: ../.., dockerfile: apps/crm-api/Dockerfile }
  restart: unless-stopped
  environment: &crm-env
    CRM_MODE: ${CRM_MODE:-hosted}
    CRM_ORIGIN: ${CRM_ORIGIN:?set CRM_ORIGIN}
    CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/crm
    CRM_REDIS_URL: redis://redis:6379/0
    CRM_PHONE_KEY_SECRET: ${CRM_PHONE_KEY_SECRET:?set CRM_PHONE_KEY_SECRET}
    CRM_FIELD_KEY: ${CRM_FIELD_KEY:?set CRM_FIELD_KEY}
    CRM_TFSC_URL: ${TFSC_ORIGIN}
    CRM_TFSC_INTERNAL_URL: http://agreements:8000
    CRM_TFSC_BRIDGE_SECRET: ${BRIDGE_SECRET:?set BRIDGE_SECRET}
    CRM_OIDC_ISSUER: ${SSO_PUBLIC_URL:?set SSO_PUBLIC_URL}/realms/tfsc
    CRM_OIDC_INTERNAL_URL: http://keycloak:8080/realms/tfsc
    CRM_OIDC_CLIENT_ID: tfsc-crm
    CRM_OIDC_CLIENT_SECRET: ${CRM_OIDC_CLIENT_SECRET:?set CRM_OIDC_CLIENT_SECRET}
    CRM_KEYCLOAK_CLIENT_SECRET: ${CRM_KEYCLOAK_CLIENT_SECRET:-}
    CRM_ALLOW_LOCAL_LOGIN: ${CRM_ALLOW_LOCAL_LOGIN:-0}
    CRM_INLINE_DISPATCHER: "0"
    CRM_INLINE_SCHEDULER: "0"
    CRM_METRICS_TOKEN: ${CRM_METRICS_TOKEN:-}
    # Files in S3-compatible storage (presigned downloads signed for FILES_PUBLIC_URL), write-once audit anchors,
    # and a virus scan of every upload.
    CRM_STORAGE: ${CRM_STORAGE:-s3}
    CRM_S3_ENDPOINT: http://objects:9000
    CRM_S3_PUBLIC_ENDPOINT: ${FILES_PUBLIC_URL:?set FILES_PUBLIC_URL}
    CRM_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
    CRM_S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    CRM_S3_BUCKET: crm-files
    CRM_ANCHOR_BUCKET: crm-audit-anchors
    CRM_CLAMAV: ${CRM_CLAMAV:-clamav:3310}
    # Telemetry: JSON logs on stdout; traces when an OTLP endpoint is set (the `observability` profile's Jaeger:
    # http://jaeger:4318); Sentry when DSNs are set. CRM_METRICS_DIR lets the uvicorn workers add up their metrics.
    CRM_METRICS_DIR: /tmp/crm-metrics
    CRM_LOG_FORMAT: ${CRM_LOG_FORMAT:-json}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    CRM_SENTRY_DSN: ${CRM_SENTRY_DSN:-}
    CRM_SENTRY_DSN_WEB: ${CRM_SENTRY_DSN_WEB:-}
  volumes: [crm-data:/data]

x-agreements: &agreements
  image: tfsc-agreements:4
  build: { context: ../.., dockerfile: apps/agreements/Dockerfile }
  restart: unless-stopped
  environment: &agr-env
    TFSC_MODE: ${TFSC_MODE:-hosted}
    TFSC_ORIGIN: ${TFSC_ORIGIN:?set TFSC_ORIGIN}
    DATABASE_URL: postgresql+psycopg://tfsc:${POSTGRES_PASSWORD}@postgres:5432/tfsc
    TFSC_DATA_DIR: /data
    TFSC_OUTPUT_ROOT: /contracts
    TFSC_RENDERER: libreoffice
    TFSC_CRM_URL: ${CRM_ORIGIN}
    TFSC_CRM_INTERNAL_URL: http://crm-api:8000
    TFSC_CRM_SHARED_SECRET: ${BRIDGE_SECRET}
    TFSC_OIDC_ISSUER: ${SSO_PUBLIC_URL}/realms/tfsc
    TFSC_OIDC_INTERNAL_URL: http://keycloak:8080/realms/tfsc
    TFSC_OIDC_CLIENT_ID: tfsc-agreements
    TFSC_OIDC_CLIENT_SECRET: ${TFSC_OIDC_CLIENT_SECRET}
    # E-signature: encrypts the company mailbox passwords (generated by the installer); reply attachments are virus
    # scanned; the platform mail server is the optional "relay" for a company without its own mailbox connection.
    TFSC_SECRET_KEY: ${TFSC_SECRET_KEY:-}
    TFSC_CLAMAV: ${TFSC_CLAMAV:-clamav:3310}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_AUTH: ${SMTP_AUTH:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    SMTP_SSL: ${SMTP_SSL:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    TFSC_SENTRY_DSN: ${TFSC_SENTRY_DSN:-}
    TFSC_LOG_FORMAT: ${TFSC_LOG_FORMAT:-json}
    DB_POOL_SIZE: "5"
  volumes: [agreements-data:/data, contracts:/contracts]

services:
  # PostgreSQL 16 + pgBackRest: every WAL file is archived (encrypted) within a minute (archive_timeout), which with the
  # backups taken by the `backup` service allows restoring to any moment of the last 14 days.
  postgres:
    build: { context: ./postgres }
    image: tfsc-postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums   # new servers only: page checksums, verified by every backup
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE}
    env_file: [{ path: ./backup-offsite.env, required: false }]   # optional off-site repository (PGBACKREST_REPO2_*)
    volumes: [postgres-data:/var/lib/postgresql/data, ./initdb:/docker-entrypoint-initdb.d:ro, backups:/backups, pg-socket:/var/run/postgresql]
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_connections=300", "-c", "shared_buffers=512MB",
              "-c", "archive_mode=on", "-c", "archive_command=pgbackrest --stanza=tfsc archive-push %p", "-c", "archive_timeout=60"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U crm -d crm"], interval: 5s, timeout: 5s, retries: 20 }

  # Backups (pgBackRest, AES-256 encrypted): weekly full + daily differential at BACKUP_HOUR (BACKUP_TZ), 14 days kept;
  # after each backup an automated restore test rebuilds the server at a point in time in an isolated scratch copy and
  # checks it (infra/compose/postgres/tfsc-backup; results in ops.backup_runs and the crm_backup_* metrics).
  backup:
    image: tfsc-postgres:16
    restart: unless-stopped
    user: postgres
    entrypoint: [tfsc-backup]
    command: [loop]
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_TZ: ${BACKUP_TZ:-America/Los_Angeles}
      BACKUP_FULL_EVERY_DAYS: ${BACKUP_FULL_EVERY_DAYS:-7}
      BACKUP_RESTORE_TEST: ${BACKUP_RESTORE_TEST:-1}
    env_file: [{ path: ./backup-offsite.env, required: false }]
    volumes: [postgres-data:/var/lib/postgresql/data:ro, backups:/backups, pg-socket:/var/run/postgresql, restore-scratch:/restore]
    depends_on: { postgres: { condition: service_healthy } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    command: ["${KC_COMMAND:-start}", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${SSO_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD}
      KC_REALM_SSL_REQUIRED: ${KC_REALM_SSL_REQUIRED:-external}
      CRM_ORIGIN: ${CRM_ORIGIN}
      TFSC_ORIGIN: ${TFSC_ORIGIN}
      CRM_OIDC_CLIENT_SECRET: ${CRM_OIDC_CLIENT_SECRET}
      TFSC_OIDC_CLIENT_SECRET: ${TFSC_OIDC_CLIENT_SECRET:?set TFSC_OIDC_CLIENT_SECRET}
      # always set: the realm always defines the provisioning client, and an empty secret must never be accepted
      CRM_KEYCLOAK_CLIENT_SECRET: ${CRM_KEYCLOAK_CLIENT_SECRET:?set CRM_KEYCLOAK_CLIENT_SECRET}
      # Outgoing mail (invitations, password resets). The `trial` profile's Mailpit is the default sink.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-24-7 Consultancy}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
    volumes: [../keycloak/realm-tfsc.json:/opt/keycloak/data/import/realm-tfsc.json:ro]
    ports: ["${PUBLISH_ADDR:-127.0.0.1}:${SSO_PORT:-8081}:8080"]
    depends_on: { postgres: { condition: service_healthy } }

  crm-migrate:
    <<: *crm
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }

  # S3-compatible object storage (RustFS, Apache-2.0): private buckets; browsers only use presigned URLs.
  objects:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment: { RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY}", RUSTFS_SECRET_KEY: "${S3_SECRET_KEY}" }
    volumes: [objects-data:/data]
    ports: ["${PUBLISH_ADDR:-127.0.0.1}:${OBJECTS_PORT:-9000}:9000"]

  # One-shot: create crm-files and the object-lock bucket crm-audit-anchors (verified to have object lock).
  objects-init:
    <<: *crm
    restart: "no"
    command: ["python", "-m", "tfsc_crm.storage", "init"]
    depends_on: [objects]

  # Virus scanner for uploads (clamd on 3310); freshclam inside keeps the signatures current.
  clamav:
    image: clamav/clamav:1.4.6
    restart: unless-stopped
    volumes: [clamav-db:/var/lib/clamav]

  crm-api:
    <<: *crm
    ports: ["${PUBLISH_ADDR:-127.0.0.1}:${CRM_PORT:-8766}:8000"]
    depends_on:
      crm-migrate: { condition: service_completed_successfully }
      objects-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Refine & Save (1,000-row pastes) and file imports run here, off the interactive API (docs/PERFORMANCE.md).
  # The edge routes those paths to this service; without the edge profile, crm-api serves everything.
  crm-bulk:
    <<: *crm
    depends_on:
      crm-migrate: { condition: service_completed_successfully }
      objects-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  crm-dispatcher:
    <<: *crm
    command: ["python", "-m", "tfsc_crm.workers.dispatcher"]
    healthcheck: { disable: true }
    depends_on: { crm-migrate: { condition: service_completed_successfully } }

  crm-scheduler:
    <<: *crm
    command: ["python", "-m", "tfsc_crm.workers.scheduler"]
    healthcheck: { disable: true }
    depends_on:
      crm-migrate: { condition: service_completed_successfully }
      objects-init: { condition: service_completed_successfully }

  agreements:
    <<: *agreements
    ports: ["${PUBLISH_ADDR:-127.0.0.1}:${TFSC_PORT:-8765}:8000"]
    command: ["uvicorn", "portal:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--no-access-log", "--proxy-headers", "--forwarded-allow-ips=*"]
    depends_on: { postgres: { condition: service_healthy } }

  agreements-worker:
    <<: *agreements
    command: ["python", "worker.py"]
    depends_on: { postgres: { condition: service_healthy } }

  # Local mail sink for trials: catches every email Keycloak sends (web UI on MAILPIT_PORT, default 8025).
  mailpit:
    profiles: [trial]
    image: axllent/mailpit:v1.27.7
    restart: unless-stopped
    ports: ["${PUBLISH_ADDR:-127.0.0.1}:${MAILPIT_PORT:-8025}:8025"]

  # Metrics, dashboards and traces (profile `observability`): Prometheus scrapes the CRM's /metrics with
  # CRM_METRICS_TOKEN and evaluates infra/observability/alerts.yml; Grafana shows the provisioned TFSC dashboard;
  # Jaeger receives OTLP traces (set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318).
  prometheus:
    profiles: [observability]
    image: quay.io/prometheus/prometheus:v3.15.0
    restart: unless-stopped
    environment: { CRM_METRICS_TOKEN: "${CRM_METRICS_TOKEN:?set CRM_METRICS_TOKEN}" }
    entrypoint: ["/bin/sh", "-c", "printf %s \"$$CRM_METRICS_TOKEN\" > /tmp/crm-metrics-token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d"]
    volumes: [../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro, prometheus-data:/prometheus]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tfsc-crm.json
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.21.0
    restart: unless-stopped
    ports: ["127.0.0.1:${JAEGER_PORT:-16686}:16686"]

  edge:
    profiles: [edge]
    image: caddy:2-alpine
    restart: unless-stopped
    environment: { CRM_DOMAIN: "${CRM_DOMAIN:-}", TFSC_DOMAIN: "${TFSC_DOMAIN:-}", SSO_DOMAIN: "${SSO_DOMAIN:-}", FILES_DOMAIN: "${FILES_DOMAIN:-}" }
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    depends_on: [crm-api, crm-bulk, agreements, keycloak, objects]

volumes:
  prometheus-data:
  grafana-data:
  objects-data:
  clamav-db:
  postgres-data:
  backups:            # pgBackRest repository (encrypted); copy it off the server or configure an off-site repo2
  pg-socket:
  restore-scratch:
  crm-data:
  agreements-data:
  contracts:
  caddy-data:
  caddy-config:
