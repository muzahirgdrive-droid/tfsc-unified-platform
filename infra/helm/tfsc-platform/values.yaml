# Secrets are never set here: create them first (see templates/NOTES.txt) and reference by name.
image:
  crm: { repository: registry.example.com/tfsc-crm, tag: "2.0.0", pullPolicy: IfNotPresent }
  agreements: { repository: registry.example.com/tfsc-agreements, tag: "4.0.0", pullPolicy: IfNotPresent }
imagePullSecrets: []

crm:
  origin: https://crm.example.com
  ssoIssuer: https://sso.example.com/realms/tfsc
  ssoInternalUrl: ""          # e.g. http://keycloak.sso.svc:8080/realms/tfsc
  oidcClientId: tfsc-crm
  allowLocalLogin: false       # break-glass only
  # keys: CRM_DATABASE_URL CRM_REDIS_URL CRM_PHONE_KEY_SECRET CRM_FIELD_KEY CRM_TFSC_BRIDGE_SECRET CRM_OIDC_CLIENT_SECRET CRM_METRICS_TOKEN
  #       CRM_S3_ACCESS_KEY CRM_S3_SECRET_KEY (files.storage s3 or an anchor bucket)
  #       CRM_KEYCLOAK_CLIENT_SECRET (optional: Keycloak emails invitations, sets groups, disables leavers)
  existingSecret: tfsc-crm
  api:
    replicas: 3
    workers: 2
    resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "2", memory: 1Gi } }
    autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 20, targetCPUUtilizationPercentage: 65 }
  # Refine & Save (1,000-row pastes) and file/legacy imports, routed by the ingress to their own pods so bulk CPU never
  # slows interactive requests (measured in docs/PERFORMANCE.md). disabled -> the api pods serve those paths.
  bulk:
    enabled: true
    replicas: 2
    workers: 2
    resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "2", memory: 1Gi } }
  dispatcher: { replicas: 2, resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } } }
  scheduler: { replicas: 1, resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } } }
  dataVolume: { size: 5Gi, storageClass: "" }   # setup key + audit-anchor sink (ship anchors to object-lock storage)

agreements:
  origin: https://agreements.example.com
  oidcClientId: tfsc-agreements
  existingSecret: tfsc-agreements   # keys: DATABASE_URL TFSC_CRM_SHARED_SECRET TFSC_OIDC_CLIENT_SECRET
  api: { replicas: 2, resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } } }
  worker: { replicas: 1, resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } } }
  contractsVolume: { size: 20Gi, storageClass: "", accessMode: ReadWriteMany }

# Files (§4.2): S3-compatible storage for photos, import files and exports; downloads are presigned URLs that expire.
# Keys CRM_S3_ACCESS_KEY / CRM_S3_SECRET_KEY go in crm.existingSecret.
files:
  storage: s3                         # s3 (recommended) or db (bytes in PostgreSQL)
  endpoint: ""                        # S3 API the pods use, e.g. http://rustfs.storage.svc:9000 or https://s3.eu-west-1.amazonaws.com
  publicEndpoint: https://files.example.com   # the same storage as browsers reach it (presigned URLs are signed for it)
  bucket: crm-files
  anchorBucket: crm-audit-anchors     # object-lock bucket for the daily audit anchors ("" = database + volume only)
  urlTtlSeconds: 120

# Upload virus scan: an in-cluster clamd (enabled) or an external one / "off" (address, when enabled is false).
clamav:
  enabled: true
  image: clamav/clamav:1.4.6
  address: ""
  resources: { requests: { cpu: 200m, memory: 1536Mi }, limits: { cpu: "1", memory: 3Gi } }

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"      # SSE
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "60m"
  crmHost: crm.example.com
  agreementsHost: agreements.example.com
  tls: [{ secretName: tfsc-tls, hosts: [crm.example.com, agreements.example.com] }]

podSecurityContext: { runAsNonRoot: true, fsGroup: 10002, seccompProfile: { type: RuntimeDefault } }
containerSecurityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: [ALL] } }
networkPolicy: { enabled: true }
