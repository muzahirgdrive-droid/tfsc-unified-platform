{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "tfsc.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: {{- toYaml .Values.ingress.tls | nindent 4 }}
  rules:
    - host: {{ .Values.ingress.crmHost }}
      http:
        paths:
          {{- if .Values.crm.bulk.enabled }}
          {{- range list "/api/activities/batch" "/api/imports" "/api/admin/legacy-imports" }}
          - { path: {{ . }}, pathType: Prefix, backend: { service: { name: {{ $.Release.Name }}-crm-bulk, port: { name: http } } } }
          {{- end }}
          {{- end }}
          - { path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-crm, port: { name: http } } } }
    - host: {{ .Values.ingress.agreementsHost }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-agreements, port: { name: http } } } }] }
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Only the ingress controller and the sibling app reach the APIs; workers accept no inbound traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-apis }
spec:
  podSelector: { matchExpressions: [{ key: app.kubernetes.io/component, operator: In, values: [crm-api, crm-bulk, agreements-api] }] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
        - podSelector: { matchLabels: { app.kubernetes.io/part-of: tfsc-platform } }
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-workers-no-ingress }
spec:
  podSelector: { matchExpressions: [{ key: app.kubernetes.io/component, operator: In, values: [crm-dispatcher, crm-scheduler, agreements-worker] }] }
  policyTypes: [Ingress]
  ingress: []
{{- end }}
