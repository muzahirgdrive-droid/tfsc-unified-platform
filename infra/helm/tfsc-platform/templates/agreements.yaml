apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-contracts
  labels: {{- include "tfsc.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.agreements.contractsVolume.accessMode }}]
  {{- with .Values.agreements.contractsVolume.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.agreements.contractsVolume.size }} } }
{{- range $name, $cfg := dict "api" .Values.agreements.api "worker" .Values.agreements.worker }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-agreements{{ if eq $name "worker" }}-worker{{ end }}
  labels: {{- include "tfsc.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agreements-{{ $name }}
spec:
  replicas: {{ $cfg.replicas }}
  selector: { matchLabels: { app.kubernetes.io/component: agreements-{{ $name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/component: agreements-{{ $name }}, app.kubernetes.io/part-of: tfsc-platform }
    spec:
      securityContext: {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agreements-{{ $name }}
          image: {{ include "tfsc.agrImage" $ }}
          imagePullPolicy: {{ $.Values.image.agreements.pullPolicy }}
          {{- if eq $name "api" }}
          command: [uvicorn, portal:app, --host, 0.0.0.0, --port, "8000", --workers, "2", --no-access-log, --proxy-headers, --forwarded-allow-ips=*]
          ports: [{ name: http, containerPort: 8000 }]
          {{- else }}
          command: [python, worker.py]
          {{- end }}
          envFrom: [{ secretRef: { name: {{ $.Values.agreements.existingSecret }} } }]
          env:
            - { name: TFSC_MODE, value: hosted }
            - { name: TFSC_ORIGIN, value: {{ $.Values.agreements.origin | quote }} }
            - { name: TFSC_DATA_DIR, value: /data }
            - { name: TFSC_OUTPUT_ROOT, value: /contracts }
            - { name: TFSC_RENDERER, value: libreoffice }
            - { name: TFSC_CRM_URL, value: {{ $.Values.crm.origin | quote }} }
            - { name: TFSC_CRM_INTERNAL_URL, value: "http://{{ $.Release.Name }}-crm:8000" }
          resources: {{- toYaml $cfg.resources | nindent 12 }}
          securityContext: {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts: [{ name: contracts, mountPath: /contracts }, { name: scratch, mountPath: /data }]
      volumes: [{ name: contracts, persistentVolumeClaim: { claimName: {{ $.Release.Name }}-contracts } }, { name: scratch, emptyDir: {} }]
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agreements
  labels: {{- include "tfsc.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: agreements-api }
  ports: [{ name: http, port: 8000, targetPort: http }]
