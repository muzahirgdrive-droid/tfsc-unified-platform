# Test-only stand-ins for what the chart expects to exist outside it: PostgreSQL, Redis and S3-compatible storage.
# Throwaway (emptyDir), for the kind smoke test only; production uses managed or properly operated services.
# Passwords and keys come from the `deps` secret that kind-smoke.sh creates.
apiVersion: v1
kind: Namespace
metadata: { name: tfsc-deps }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: tfsc-deps }
data:
  10-databases.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<SQL
    CREATE ROLE tfsc LOGIN PASSWORD '${POSTGRES_PASSWORD}';
    CREATE DATABASE tfsc OWNER tfsc;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    SQL
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: tfsc-deps }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: crm }
            - { name: POSTGRES_DB, value: crm }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: deps, key: POSTGRES_PASSWORD } } }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, crm, -d, crm] }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }, { name: init, mountPath: /docker-entrypoint-initdb.d }]
      volumes: [{ name: data, emptyDir: {} }, { name: init, configMap: { name: postgres-init } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: tfsc-deps }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: tfsc-deps }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - { name: redis, image: "redis:7-alpine", imagePullPolicy: IfNotPresent, ports: [{ containerPort: 6379 }],
            readinessProbe: { exec: { command: [redis-cli, ping] }, periodSeconds: 5 } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: tfsc-deps }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rustfs, namespace: tfsc-deps }
spec:
  replicas: 1
  selector: { matchLabels: { app: rustfs } }
  template:
    metadata: { labels: { app: rustfs } }
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          imagePullPolicy: IfNotPresent
          env:
            - { name: RUSTFS_ACCESS_KEY, valueFrom: { secretKeyRef: { name: deps, key: S3_ACCESS_KEY } } }
            - { name: RUSTFS_SECRET_KEY, valueFrom: { secretKeyRef: { name: deps, key: S3_SECRET_KEY } } }
          ports: [{ containerPort: 9000 }]
          readinessProbe: { tcpSocket: { port: 9000 }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: rustfs, namespace: tfsc-deps }
spec: { selector: { app: rustfs }, ports: [{ port: 9000 }] }
