# Single-node kind cluster for the Helm smoke test (infra/helm/smoke/kind-smoke.sh). Ports 80/443 of the host reach the
# ingress controller; kindnet enforces NetworkPolicies (kind >= 0.24), so the chart's policies are really tested.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 80, protocol: TCP }
      - { containerPort: 443, hostPort: 443, protocol: TCP }
