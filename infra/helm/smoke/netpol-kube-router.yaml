# Test-only NetworkPolicy enforcement for kind nodes whose kernel lacks nftables `queue` (CONFIG_NFT_QUEUE), which
# kindnet's policy controller needs. kube-router in firewall-only mode enforces policies with iptables + ipset; kindnet
# keeps doing pod networking. Used by kind-smoke.sh when NETPOL_ENFORCER=kube-router.
apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-router, namespace: kube-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: kube-router }
rules:
  - { apiGroups: [""], resources: [namespaces, pods, services, nodes, endpoints], verbs: [get, list, watch] }
  - { apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [get, list, watch] }
  - { apiGroups: [discovery.k8s.io], resources: [endpointslices], verbs: [get, list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: kube-router }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kube-router }
subjects: [{ kind: ServiceAccount, name: kube-router, namespace: kube-system }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: kube-router, namespace: kube-system, labels: { k8s-app: kube-router } }
spec:
  selector: { matchLabels: { k8s-app: kube-router } }
  template:
    metadata: { labels: { k8s-app: kube-router } }
    spec:
      serviceAccountName: kube-router
      hostNetwork: true
      tolerations: [{ operator: Exists }]
      containers:
        - name: kube-router
          image: cloudnativelabs/kube-router:v2.11.1
          imagePullPolicy: IfNotPresent
          args: [--run-router=false, --run-firewall=true, --run-service-proxy=false, --bgp-graceful-restart=false]
          env: [{ name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }]
          securityContext: { privileged: true }
          volumeMounts:
            - { name: lib-modules, mountPath: /lib/modules, readOnly: true }
            - { name: xtables-lock, mountPath: /run/xtables.lock }
      volumes:
        - { name: lib-modules, hostPath: { path: /lib/modules } }
        - { name: xtables-lock, hostPath: { path: /run/xtables.lock, type: FileOrCreate } }
