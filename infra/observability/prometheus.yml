# Prometheus for the compose stack (profile `observability`). The bearer token is written from CRM_METRICS_TOKEN at
# container start; /metrics answers 404 without it.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: crm
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /tmp/crm-metrics-token }
    static_configs:
      - targets: ['crm-api:8000']
        labels: { pool: interactive }
      - targets: ['crm-bulk:8000']
        labels: { pool: bulk }
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
