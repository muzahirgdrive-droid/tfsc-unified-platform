# Production facts for TFSC Agreements on legal.24-7consultancy.cloud. Read by agreements.sh and validate-release.sh.
# NO SECRETS HERE: passwords and keys stay in the production .env, which this package never contains or changes.
# Change a value only when the server really changed, and only with the owner's authorization (PRODUCTION-ADAPTATION.md).

PROJECT=tfsc-agreements-legal                 # Docker Compose project name
DOMAIN=legal.24-7consultancy.cloud            # must equal TFSC_DOMAIN in the production .env
PROD_DIR=/opt/tfsc-agreements-legal           # the running installation (its .env and bind-mounted folders stay there)
ENV_FILE=                                     # empty: detected from the running web container's Compose labels, else $PROD_DIR

# Compose services
WEB=legal-agreements
WORKER=agreements-worker
DB=postgres
BACKUP=backup
CLAMAV=clamav

# Database
DB_NAME=tfsc
DB_SUPERUSER=crm
DB_SOCKET=/var/run/postgresql
BACKUP_PASS_ENV=PGBACKREST_REPO1_CIPHER_PASS  # the backup container's variable holding the backup passphrase

# Images. The application image is the only one an update builds or replaces.
APP_REPO=tfsc-agreements
CURRENT_IMAGE=tfsc-agreements:20261117-32267ca
CURRENT_IMAGE_ID=sha256:09eedd0d477a5e6245601cc5596d793d6a61654e4b062dc03a6fb2b208749c8b
ROLLBACK_IMAGE=tfsc-agreements:rollback-20261125
ROLLBACK_IMAGE_ID=sha256:09eedd0d477a5e6245601cc5596d793d6a61654e4b062dc03a6fb2b208749c8b
POSTGRES_IMAGE=tfsc-postgres:16
BACKUP_IMAGE=tfsc-postgres:20261110-c803dc9
CLAMAV_IMAGE=clamav/clamav:1.4.6
FORBIDDEN_IMAGES="tfsc-agreements:4 tfsc-agreements:rollback"   # upstream tags that point at other images on this server

# Networks
DEFAULT_NETWORK=tfsc-agreements-legal_default
EDGE_NETWORK=alphabridge_edge                 # the independently managed Caddy reaches the web service here
EDGE_ALIAS=tfsc-agreements-legal
LINK_NETWORK=tfsc-link                        # private network OCS reads the integration feed over (created if missing)

# Volumes (external, reused as they are; never created, renamed or removed by this package)
VOLUMES="tfsc-agreements-legal_postgres-data tfsc-agreements-legal_backups tfsc-agreements-legal_pg-socket tfsc-agreements-legal_restore-scratch tfsc-agreements-legal_clamav-db tfsc-agreements-legal_agreements-data tfsc-agreements-legal_contracts"

# Settings that must stay as they are
PG_EXPECT="max_connections=100 shared_buffers=256MB effective_cache_size=4GB archive_mode=on"
APP_EXPECT="WEB_WORKERS=2 WEB_THREADS=8 DB_POOL_SIZE=8 DB_POOL_OVERFLOW=4 TFSC_GENERATION_WORKERS=1 TFSC_COMPLETION_WORKERS=1"

# Environment variables an update may change on the web/worker containers (names; empty = none). Anything else that
# differs from the running containers stops the update before any change.
ALLOW_ENV_CHANGES=

# Migrations reviewed for this server (MIGRATION-REVIEW.md). A release with others is flagged for review.
KNOWN_MIGRATIONS="0001_agreements_baseline 0002_esign 0003_docusign_parity 0004_premium_portal 0005_signature_size 0006_custom_companies 0007_test_marks 0008_client_records 0009_five_companies 0010_billing_nest_letterhead 0011_client_trash 0012_audit_fixes 0013_followups_margins 0014_integration_feed 0015_reminders"

# Health checks
WEB_HEALTH_SECONDS=300
WORKER_HEALTH_SECONDS=420
