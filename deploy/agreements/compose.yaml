# TFSC Agreements on one server, without the CRM, company SSO or file storage: Agreements and its worker (documents,
# e-signature email, reading the company inboxes), PostgreSQL with encrypted backups and a nightly restore test, a
# virus scanner for email attachments, and Caddy for HTTPS. Started by ../../agreements.sh (START-HERE.md).
# Only Caddy's ports 80/443 are reachable from outside; Agreements listens on 127.0.0.1 for the installer's checks.
name: tfsc-agreements

x-agreements: &agreements
  image: tfsc-agreements:4
  build: { context: ../.., dockerfile: apps/agreements/Dockerfile }
  restart: unless-stopped
  environment:
    TFSC_MODE: hosted
    TFSC_ORIGIN: https://${TFSC_DOMAIN:?set TFSC_DOMAIN}
    DATABASE_URL: postgresql+psycopg://tfsc:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/tfsc
    TFSC_DATA_DIR: /data
    TFSC_OUTPUT_ROOT: /contracts
    TFSC_RENDERER: libreoffice
    # Encrypts the company mailbox passwords (generated by the installer). Reply attachments are virus-scanned.
    TFSC_SECRET_KEY: ${TFSC_SECRET_KEY:?set TFSC_SECRET_KEY}
    TFSC_CLAMAV: ${TFSC_CLAMAV:-clamav:3310}
    # Optional: a mail server for companies whose own mailbox is not connected ("platform mail server" in the app).
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_AUTH: ${SMTP_AUTH:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    SMTP_SSL: ${SMTP_SSL:-false}
    TFSC_LOG_FORMAT: json
    DB_POOL_SIZE: "5"
  volumes: [agreements-data:/data, contracts:/contracts]
  depends_on: { postgres: { condition: service_healthy } }

services:
  # PostgreSQL 16 + pgBackRest: every WAL file is archived (encrypted) within a minute, so with the nightly backups the
  # database can be restored to any moment of the last 14 days. The superuser and the maintenance database are called
  # "crm" because the shared backup tool records its runs there; they hold no CRM data.
  postgres:
    build: { context: ../../infra/compose/postgres }
    image: tfsc-postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE}
    env_file: [{ path: ./backup-offsite.env, required: false }]   # optional off-site repository (PGBACKREST_REPO2_*)
    volumes: [postgres-data:/var/lib/postgresql/data, ./initdb:/docker-entrypoint-initdb.d:ro, backups:/backups, pg-socket:/var/run/postgresql]
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_connections=100", "-c", "shared_buffers=256MB",
              "-c", "archive_mode=on", "-c", "archive_command=pgbackrest --stanza=tfsc archive-push %p", "-c", "archive_timeout=60"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U crm -d crm"], interval: 5s, timeout: 5s, retries: 20 }

  # Weekly full + daily differential backup at BACKUP_HOUR (BACKUP_TZ), AES-256 encrypted, 14 days kept; after each
  # backup a restore test rebuilds the database at a point in time in a throwaway copy and checks it.
  backup:
    image: tfsc-postgres:16
    restart: unless-stopped
    user: postgres
    entrypoint: [tfsc-backup]
    command: [loop]
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_TZ: ${BACKUP_TZ:-America/Los_Angeles}
      BACKUP_FULL_EVERY_DAYS: ${BACKUP_FULL_EVERY_DAYS:-7}
      BACKUP_RESTORE_TEST: ${BACKUP_RESTORE_TEST:-1}
    env_file: [{ path: ./backup-offsite.env, required: false }]
    volumes: [postgres-data:/var/lib/postgresql/data:ro, backups:/backups, pg-socket:/var/run/postgresql, restore-scratch:/restore]
    depends_on: { postgres: { condition: service_healthy } }

  # Scans files that clients attach to their email replies before they are kept.
  clamav:
    image: clamav/clamav:1.4.6
    restart: unless-stopped
    volumes: [clamav-db:/var/lib/clamav]

  agreements:
    <<: *agreements
    ports: ["127.0.0.1:${TFSC_PORT:-8765}:8000"]
    command: ["uvicorn", "portal:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--no-access-log", "--proxy-headers", "--forwarded-allow-ips=*"]

  agreements-worker:
    <<: *agreements
    command: ["python", "worker.py"]

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment: { TFSC_DOMAIN: "${TFSC_DOMAIN}" }
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    depends_on: [agreements]

volumes:
  postgres-data:
  backups:            # pgBackRest repository (encrypted); configure an off-site copy in backup-offsite.env
  pg-socket:
  restore-scratch:
  clamav-db:
  agreements-data:
  contracts:
  caddy-data:
  caddy-config:
