[project]
name = "tfsc-refine"
version = "1.0.0"
description = "TFSC refinement engine (names, phones, emails, dates) - Python reference implementation"
requires-python = ">=3.12"
dependencies = ["phonenumbers>=9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tfsc_refine"]
