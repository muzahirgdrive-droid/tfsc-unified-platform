[project]
name = "tfsc-bridge"
version = "2.0.0"
description = "TFSC <-> CRM signed integration contract"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tfsc_bridge"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
