name: tfsc-compliance
x-common: &common
  image: tfsc-compliance:4.0.0
  build:
    context: ../..
    dockerfile: apps/agreements/Dockerfile
  restart: unless-stopped
  environment: &environment
    TFSC_MODE: hosted
    TFSC_ORIGIN: https://${TFSC_DOMAIN:?Set TFSC_DOMAIN in .env}
    DATABASE_URL: postgresql+psycopg://tfsc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/tfsc
    TFSC_DATA_DIR: /data
    TFSC_OUTPUT_ROOT: /contracts
    TFSC_RENDERER: libreoffice
    DB_POOL_SIZE: "5"
  volumes:
    - app-data:/data
    - contracts:/contracts
    # Mount licensed Times New Roman fonts here before visual acceptance.
    - ./deployment-fonts:/usr/local/share/fonts/tfsc:ro
  depends_on:
    database:
      condition: service_healthy
services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tfsc
      POSTGRES_USER: tfsc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfsc -d tfsc"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    <<: *common
    command: ["uvicorn","portal:app","--host","0.0.0.0","--port","8000","--workers","2","--no-access-log","--proxy-headers","--forwarded-allow-ips=*"]
  worker:
    <<: *common
    command: ["python","worker.py"]
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TFSC_DOMAIN: ${TFSC_DOMAIN:?Set TFSC_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
volumes:
  postgres-data:
  app-data:
  contracts:
  caddy-data:
  caddy-config:
